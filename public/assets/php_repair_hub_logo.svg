<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@900&amp;family=Montserrat:wght@900&amp;display=swap');
      .php-text {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 900;
        font-size: 148px;
        fill: #0c2742;
        letter-spacing: 4px;
      }
      .hub-text {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 78px;
        fill: #f26522;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- PHP Top Serif Heading -->
  <text x="250" y="130" text-anchor="middle" class="php-text">PHP</text>

  <!-- Bottom Brand Text: Repair Hub -->
  <g id="repair-hub-group">
    <!-- "Repa" -->
    <text x="12" y="202" class="hub-text">Repa</text>

    <!-- Wrench icon replacing the 'i' in Repair -->
    <g transform="translate(236, 142) scale(0.95)">
      <!-- Wrench Body / Stem -->
      <path d="M 12 18 L 12 60 A 6 6 0 0 0 20 60 L 20 18 Z" fill="#f26522" />
      <!-- Top Open Wrench Head -->
      <path d="M 6 18 C 2 12 4 4 11 1 C 14 0 18 0 21 1 C 28 4 30 12 26 18 L 22 18 C 24 14 22 8 18 6 C 14 6 12 10 14 18 Z" fill="#f26522" />
      <path d="M 9 16 C 7 11 9 5 16 3 C 23 5 25 11 23 16 L 19 16 C 19 11 16 9 16 9 C 16 9 13 11 13 16 Z" fill="#f26522" />
      <!-- Bottom loop / box end of wrench -->
      <circle cx="16" cy="62" r="7.5" fill="#f26522" />
      <circle cx="16" cy="62" r="3.5" fill="#faf8f4" />
      <!-- Wrench jaw detail -->
      <path d="M 10 6 L 16 12 L 22 6 L 25 12 C 23 20 9 20 7 12 Z" fill="#f26522" />
      <polygon points="13,4 19,4 18,11 14,11" fill="#faf8f4" />
    </g>

    <!-- "r" in Repair -->
    <text x="268" y="202" class="hub-text">r</text>

    <!-- Space -->
    <!-- "H" in Hub -->
    <text x="318" y="202" class="hub-text">H</text>

    <!-- Gear + Airplane replacing the 'u' in Hub -->
    <g transform="translate(412, 172) scale(0.92)">
      <!-- Gear Outer Teeth -->
      <path d="M 0 -28 L 5 -28 L 6 -24 L 13 -22 L 17 -25 L 21 -22 L 20 -17 L 25 -12 L 29 -14 L 31 -10 L 28 -6 L 30 1 L 34 2 L 34 7 L 29 9 L 29 16 L 33 19 L 31 23 L 26 23 L 23 28 L 25 32 L 21 35 L 17 31 L 11 34 L 10 38 L 5 38 L 4 33 L -3 33 L -5 37 L -10 37 L -11 32 L -17 30 L -20 34 L -24 31 L -22 26 L -27 22 L -31 24 L -33 20 L -29 17 L -30 10 L -34 9 L -34 4 L -29 2 L -29 -5 L -33 -8 L -31 -12 L -26 -12 L -23 -17 L -25 -21 L -21 -24 L -17 -20 L -11 -23 L -10 -27 L -5 -27 L -4 -22 L 3 -22 Z" fill="#f26522" />
      <!-- Inner circular cut / cavity of gear -->
      <circle cx="0" cy="5" r="16.5" fill="#f26522" />
      
      <!-- Airplane Silhouette inside gear (pointing upright) -->
      <!-- Fuselage -->
      <path d="M 0 -7 C 1.5 -7 2.2 -3 2.2 4 L 2.2 11 L 5 15 L 5 17 L 1.5 16 L 1.5 19 L 3.5 21 L 3.5 22.5 L 0 22 L -3.5 22.5 L -3.5 21 L -1.5 19 L -1.5 16 L -5 17 L -5 15 L -2.2 11 L -2.2 4 C -2.2 -3 -1.5 -7 0 -7 Z" fill="#ffffff" />
      <!-- Main Wings -->
      <path d="M 0 3 L 13 11 L 13 13.5 L 1.8 9.5 L -1.8 9.5 L -13 13.5 L -13 11 Z" fill="#ffffff" />
    </g>

    <!-- "b" in Hub -->
    <text x="446" y="202" class="hub-text">b</text>
  </g>
</svg>
